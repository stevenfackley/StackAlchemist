services:
  sa-engine:
    container_name: sa-engine
    build:
      context: ..
      target: engine
    ports:
      - "5000:80"
    env_file:
      - ../.env
    environment:
      # Overrides any DATABASE_URL from ../.env: inside the compose network the
      # Engine reaches Postgres by service name, not localhost.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stackalchemist?sslmode=disable
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - stackalchemist-test

  sa-web:
    container_name: sa-web
    build:
      context: ..
      target: web
      args:
        # Build-time public env. Required: NEXT_PUBLIC_IS_TEST_SITE must be
        # "true" here, otherwise the layout.tsx robots block bakes index/follow
        # and the test mirror becomes a duplicate-content liability.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://test.stackalchemist.app}
        NEXT_PUBLIC_IS_TEST_SITE: "true"
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    restart: always
    depends_on:
      sa-engine:
        condition: service_healthy
    healthcheck:
      # Use /api/healthz — exempt from Basic Auth and always returns 200.
      # Hitting / would fail once Basic Auth is configured.
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - stackalchemist-test

  # Phase D CI stack: Postgres + Keycloak for the E2E lane. ./keycloak is
  # relative to this compose file's directory (docker/keycloak).
  postgres:
    container_name: sa-test-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stackalchemist
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stackalchemist"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - stackalchemist-test

  keycloak:
    container_name: sa-test-keycloak
    image: quay.io/keycloak/keycloak:26.5.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships no curl/wget; bash's /dev/tcp against the management port.
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    networks:
      - stackalchemist-test

networks:
  stackalchemist-test:
    name: stackalchemist-test
