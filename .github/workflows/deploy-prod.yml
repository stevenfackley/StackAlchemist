name: Deploy Production Site

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && format('Manual · {0}', github.actor)
    || github.event.head_commit.message
  }}

on:
  push:
    branches:
      - main
    # Changes that never reach the shipped images must not cycle prod — a
    # test-only merge used to cost a full build + maintenance window.
    # NOTE: content/**/*.md is baked into the web image at build time, so
    # markdown is NOT blanket-ignored here.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'src/StackAlchemist.Engine.Tests/**'
      - 'src/StackAlchemist.Web/e2e/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-test.yml'
      - '.github/workflows/secret-scan.yml'
      - '.github/workflows/dependabot-auto-merge.yml'
      - '.github/workflows/prod-healthwatch.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  # Queue deploys instead of cancelling: a cancel that lands between teardown
  # and swap used to strand the maintenance page until the next run finished.
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Deploy Production Stack
    timeout-minutes: 30
    runs-on:
      - self-hosted
      - linux
      - ARM64
      - prod
    environment: prod
    env:
      COMPOSE_PROJECT_NAME: stackalchemist-prod
      DEPLOY_DIR: /opt/stackalchemist-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the migration gate below can diff the pushed range
          # (github.event.before..github.sha) for supabase/migrations changes.
          fetch-depth: 0

      - name: Explain OIDC usage
        run: |
          echo "This workflow requests GitHub OIDC tokens so future AWS-integrated steps can assume an IAM role."
          echo "The current production deploy runs locally on the EC2 self-hosted runner and does not require SSH deployment."

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Confirm OIDC role assumption
        shell: bash
        run: |
          echo "AWS OIDC credentials configured successfully for region: ${AWS_REGION}"
          echo "Role assumption completed via aws-actions/configure-aws-credentials."

      - name: Setup .env (prod)
        uses: ./.github/actions/setup-env
        with:
          environment: production
          app_url: https://stackalchemist.app
          aspnetcore_environment: Production
          api_port: '5000'
          engine_api_url: http://sa-engine
          is_test_site: 'false'
          supabase_url: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          cf_account_id: ${{ secrets.CF_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          r2_bucket_name: stackalchemist-generations-prod
          r2_public_url: ${{ secrets.R2_PUBLIC_URL }}
          cloudflare_tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN || secrets.CF_TUNNEL_TOKEN }}
          stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          anthropic_model: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          engine_service_key: ${{ secrets.ENGINE_SERVICE_KEY }}
          byok_encryption_key: ${{ secrets.BYOK_ENCRYPTION_KEY }}
          # Only prod reports to Plausible / advertises Search Console verification.
          plausible_domain: ${{ secrets.PLAUSIBLE_DOMAIN }}
          google_site_verification: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          # Basic Auth vars intentionally empty on prod.
          test_site_basic_auth_user: ''
          test_site_basic_auth_pass: ''
          resend_api_key: ${{ secrets.RESEND_API_KEY }}

      - name: Apply Supabase migrations (prod)
        # Runs BEFORE the image build so new code never goes live against an
        # older schema. This step exists because nothing else applies
        # migrations to prod: on 2026-07-04 prod was found 3 weeks behind main
        # (missing process_checkout_completed, enforce_free_generation_quota,
        # error_category, and the generations RLS lockdown) while the deployed
        # code already depended on them — paid checkout webhooks were failing.
        #
        # Bootstrap-friendly gate: when the secret is absent, SKIP with a loud
        # warning — UNLESS the push itself contains migration changes, in which
        # case the deploy hard-fails (shipping that code would guarantee drift).
        # With the secret present, hard-fail on any broken URL or failed push.
        # Add the secret to the prod environment to flip this from advisory to
        # fully enforcing. See docs/runbooks/ci-supabase-migrations.md.
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            # Drift guard: if THIS push changes supabase/migrations, shipping
            # its code against a schema prod cannot receive re-creates the June
            # incident (paid checkout silently broken ~3 weeks). Fail loudly
            # instead. Pushes without migration changes still skip-with-warning
            # so the pipeline stays bootstrap-friendly until the secret exists.
            BEFORE="${{ github.event.before }}"
            if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              if git diff --name-only "$BEFORE" "${{ github.sha }}" -- supabase/migrations 2>/dev/null | grep -q .; then
                echo "::error::This push changes supabase/migrations but PROD_SUPABASE_DB_URL is unset — deploying would run new code against a stale prod schema. Set the secret (prod environment) or apply the migrations manually (with matching schema_migrations ledger rows), then re-run this workflow. See docs/runbooks/ci-supabase-migrations.md."
                echo "### ❌ Deploy blocked: migration changes in this push cannot be applied (PROD_SUPABASE_DB_URL unset)" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            echo "::warning::PROD_SUPABASE_DB_URL is not set — SKIPPING automatic migration apply. Prod schema parity is NOT enforced on this deploy. Add the secret (prod environment) to enable it. Format: postgresql://postgres.<ref>:<password>@<pooler-host>:6543/postgres — same shape as CI_SUPABASE_DB_URL. See docs/runbooks/ci-supabase-migrations.md."
            echo "### ⚠️ Supabase migrations NOT applied (PROD_SUPABASE_DB_URL unset)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::add-mask::${SUPABASE_DB_URL}"

          # supabase db push reads the password from SUPABASE_DB_PASSWORD, not
          # the URL (same derivation as ci.yml's CI migration step).
          url_no_scheme="${SUPABASE_DB_URL#*://}"
          userpart="${url_no_scheme%@*}"
          SUPABASE_DB_PASSWORD="${userpart#*:}"
          export SUPABASE_DB_PASSWORD
          echo "::add-mask::${SUPABASE_DB_PASSWORD}"
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::Failed to extract password from PROD_SUPABASE_DB_URL. URL form must be postgresql://<user>:<password>@<host>:<port>/<db>."
            exit 1
          fi

          # Install the Supabase CLI if the runner doesn't already have it.
          # This is a self-hosted ARM64 runner — arm64 tarball, not amd64.
          if ! command -v supabase >/dev/null 2>&1; then
            SUPABASE_CLI_VERSION="v2.98.2"
            curl -fsSL "https://github.com/supabase/cli/releases/download/${SUPABASE_CLI_VERSION}/supabase_linux_arm64.tar.gz" \
              | tar -xz -C /tmp
            sudo mv /tmp/supabase /usr/local/bin/supabase
          fi
          echo "Supabase CLI: $(supabase --version)"

          # --include-all tolerates out-of-order versions already in the prod
          # ledger (e.g. the ad-hoc 20260530192042 entry). Idempotent: applied
          # versions are tracked in supabase_migrations.schema_migrations.
          supabase db push \
            --db-url "$SUPABASE_DB_URL" \
            --include-all

      - name: Docker pre-flight cleanup
        shell: bash
        run: bash ./scripts/docker-preflight-cleanup.sh

      - name: Runner diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Runner: ${RUNNER_NAME:-unknown} (${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown})"
          echo "Docker version:"
          docker version
          echo ""
          echo "Docker system usage:"
          docker system df || true
          echo ""
          echo "Disk usage:"
          df -h / || true
          echo ""
          echo "Memory:"
          free -h || true

      - name: Verify Docker Compose file
        shell: bash
        run: docker compose -f docker-compose.prod.yml config >/dev/null

      - name: Build production images
        shell: bash
        env:
          DOCKER_BUILDKIT: '1'
          COMPOSE_PARALLEL_LIMIT: '1'
        run: |
          set -Eeuo pipefail
          # Build BEFORE any teardown: the live stack keeps serving traffic for
          # the whole 4–8 min build, and a failed build aborts the deploy with
          # the previous version still up — a red deploy is no longer an outage.
          # Builds stay sequential to respect the small ARM box; if the first
          # attempt OOMs against the running stack, the retry prunes the builder
          # cache and tries once more before giving up (stack still untouched).
          echo "Building images in workspace root (sequentially, live stack still serving)..."
          for service in sa-web sa-engine; do
            attempt=1
            until docker compose -f docker-compose.prod.yml build "$service"; do
              if [ "$attempt" -ge 2 ]; then
                echo "❌ Failed to build $service after $attempt attempts. Previous version is still serving traffic — no outage."
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "Retrying build for $service after a short cooldown..."
              docker builder prune -f --filter "until=1h" 2>/dev/null || true
              sleep 15
            done
          done

      - name: Setup reboot resilience
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p "$DEPLOY_DIR"
          sudo cp docker-compose.prod.yml "$DEPLOY_DIR/"
          sudo cp Dockerfile "$DEPLOY_DIR/"
          sudo cp .env "$DEPLOY_DIR/"
          sudo cp -r docker/ "$DEPLOY_DIR/"
          sudo cp docker/stackalchemist-prod.service /etc/systemd/system/stackalchemist-prod.service
          sudo systemctl daemon-reload
          sudo systemctl enable stackalchemist-prod.service
          echo "✅ Reboot resilience configured at $DEPLOY_DIR"

      - name: Start maintenance page (swap window only)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Images are already built, so this shim fronts only the short
          # container-swap window (~30–60s), not the multi-minute build.
          # sa-tunnel is intentionally untouched — it's a long-lived standalone
          # container that must survive deploys to avoid Cloudflare Error 1033.
          docker network create stackalchemist-prod 2>/dev/null || true

          # Replace the real reverse proxy with the maintenance shim.
          # --network-alias mirrors the compose alias so CF tunnel ingress keeps
          # resolving whichever hostname it's pointed at.
          docker rm -f sa-reverse-proxy 2>/dev/null || true
          docker run -d \
            --name sa-reverse-proxy \
            --restart no \
            --network stackalchemist-prod \
            --network-alias reverse-proxy \
            -v "$(pwd)/docker/maintenance.html:/usr/share/nginx/html/maintenance.html:ro" \
            -v "$(pwd)/docker/nginx-maintenance.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine

          # Connect the persistent tunnel so it can route to the shim.
          if docker inspect sa-tunnel &>/dev/null; then
            docker network connect stackalchemist-prod sa-tunnel 2>/dev/null || true
            echo "✅ sa-tunnel connected — maintenance page is live for the swap."
          else
            echo "ℹ️  sa-tunnel not found — tunnel will connect after first manual setup."
          fi

      - name: Deploy production stack
        shell: bash
        env:
          COMPOSE_PARALLEL_LIMIT: '1'
        run: |
          set -Eeuo pipefail
          cd "$DEPLOY_DIR"

          # Recreate the app containers behind the maintenance shim, wait for
          # health, and only THEN swap nginx in — visitors see the maintenance
          # page for the recreate window and a few seconds of proxy swap,
          # instead of the whole build.
          docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans sa-web sa-engine

          # Make sure the standalone tunnel is attached before nginx swaps in.
          if docker inspect sa-tunnel &>/dev/null; then
            docker network connect stackalchemist-prod sa-tunnel 2>/dev/null || true
          fi

          echo "Waiting for sa-web / sa-engine to become healthy..."
          MAX_WAIT=120
          INTERVAL=5
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            WEB=$(docker inspect --format '{{.State.Health.Status}}' sa-web 2>/dev/null || echo missing)
            ENGINE=$(docker inspect --format '{{.State.Health.Status}}' sa-engine 2>/dev/null || echo missing)
            if [ "$WEB" = "healthy" ] && [ "$ENGINE" = "healthy" ]; then
              echo "✅ App containers healthy after ${ELAPSED}s"
              break
            fi
            echo "⏳ sa-web=$WEB sa-engine=$ENGINE (${ELAPSED}s / ${MAX_WAIT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "❌ FATAL: app containers not healthy within ${MAX_WAIT}s — leaving maintenance shim up."
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 30
            exit 1
          fi

          # Swap: replace the maintenance shim with the real reverse proxy.
          # sa-web/sa-engine are already healthy, so nginx starts immediately —
          # the shim-to-nginx gap is a few seconds, not a health-wait.
          docker rm -f sa-reverse-proxy 2>/dev/null || true
          docker compose -f docker-compose.prod.yml up -d reverse-proxy

          # Reconnect the persistent tunnel in case compose recreated the network.
          if docker inspect sa-tunnel &>/dev/null; then
            docker network connect stackalchemist-prod sa-tunnel 2>/dev/null || true
            echo "✅ sa-tunnel reconnected to stackalchemist-prod network."
          fi

      - name: Wait for health checks
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$DEPLOY_DIR"
          echo "Waiting for containers to become healthy..."
          MAX_WAIT=120
          INTERVAL=5
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            UNHEALTHY=$(docker compose -f docker-compose.prod.yml ps --format json | \
              python3 -c "
          import sys, json
          unhealthy = 0
          for line in sys.stdin:
              line = line.strip()
              if not line: continue
              svc = json.loads(line)
              health = svc.get('Health', '')
              if health != 'healthy':
                  unhealthy += 1
                  print(f\"  {svc.get('Name','?')}: {svc.get('State','?')} ({health or 'no healthcheck'})\", file=sys.stderr)
          print(unhealthy)
          " 2>&1)
            # Extract the count (last line of output)
            COUNT=$(echo "$UNHEALTHY" | tail -1)
            if [ "$COUNT" = "0" ]; then
              echo "✅ All containers healthy after ${ELAPSED}s"
              break
            fi
            echo "⏳ ${COUNT} container(s) not yet healthy (${ELAPSED}s / ${MAX_WAIT}s)..."
            echo "$UNHEALTHY" | head -n -1
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "❌ FATAL: Containers did not become healthy within ${MAX_WAIT}s"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 30
            exit 1
          fi

      - name: Verify site is reachable (end-to-end via CF tunnel)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Probes /api/healthz end-to-end through Cloudflare → tunnel → nginx
          # → sa-web. /api/healthz is auth-exempt and a 200 proves every hop is
          # reachable — including the tunnel ingress hostname. Retries for up
          # to 120s because CF Tunnel can take a few seconds to reattach after
          # the deploy re-creates the stackalchemist-prod network.
          URL="https://stackalchemist.app/api/healthz"
          MAX_WAIT=120
          INTERVAL=5
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ $URL returned 200 after ${ELAPSED}s"
              exit 0
            fi
            echo "⏳ $URL → ${HTTP_CODE} (${ELAPSED}s / ${MAX_WAIT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "❌ FATAL: $URL did not return 200 within ${MAX_WAIT}s"
          echo "--- sa-tunnel logs (last 40) ---"
          docker logs sa-tunnel --tail 40 2>&1 || true
          echo "--- sa-reverse-proxy logs (last 40) ---"
          docker logs sa-reverse-proxy --tail 40 2>&1 || true
          exit 1

      - name: Capture deploy diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p .artifacts/deploy-prod
          docker ps -a > .artifacts/deploy-prod/docker-ps.txt
          docker compose -f docker-compose.prod.yml ps > .artifacts/deploy-prod/compose-ps-workspace.txt 2>&1 || true
          docker compose -f docker-compose.prod.yml logs --tail 200 > .artifacts/deploy-prod/compose-workspace.log 2>&1 || true
          if [ -d "$DEPLOY_DIR" ]; then
            cd "$DEPLOY_DIR"
            docker compose -f docker-compose.prod.yml ps > "$GITHUB_WORKSPACE/.artifacts/deploy-prod/compose-ps-deploy-dir.txt" 2>&1 || true
            docker compose -f docker-compose.prod.yml logs --tail 200 > "$GITHUB_WORKSPACE/.artifacts/deploy-prod/compose-deploy-dir.log" 2>&1 || true
          fi
          docker logs sa-engine > .artifacts/deploy-prod/sa-engine.log 2>&1 || true
          docker logs sa-web > .artifacts/deploy-prod/sa-web.log 2>&1 || true
          docker logs sa-reverse-proxy > .artifacts/deploy-prod/sa-reverse-proxy.log 2>&1 || true
          docker logs sa-tunnel > .artifacts/deploy-prod/sa-tunnel.log 2>&1 || true

      - name: Upload deploy diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-prod-diagnostics
          path: .artifacts/deploy-prod/
          retention-days: 7

      - name: Show running containers
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$DEPLOY_DIR"
          docker compose -f docker-compose.prod.yml ps

      - name: Post-deploy Docker cleanup
        if: always()
        shell: bash
        run: |
          docker image prune -f 2>/dev/null || true
          docker builder prune -f --filter "until=1h" 2>/dev/null || true
          df -h / 2>/dev/null || true
