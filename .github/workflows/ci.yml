name: CI

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && format('Manual · {0}', github.actor)
    || github.event_name == 'schedule' && 'Nightly'
    || github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
    || github.event.head_commit.message
  }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  frontend:
    name: Frontend (Lint, Typecheck, Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/StackAlchemist.Web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stackalchemist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d stackalchemist_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/stackalchemist_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/StackAlchemist.Web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Migration drift guard
        # schema.ts and drizzle/ must agree: a schema edit without a generated
        # migration would only surface when prod's migrate step ran it. Both
        # signals are required: a rename makes drizzle-kit ask an interactive
        # question, which on a non-TTY prints "Interactive prompts require a
        # TTY", writes nothing and exits 0, so a clean git status alone would
        # pass. Only the explicit no-op message proves there is no drift.
        run: |
          out=$(npm run db:generate -- --name ci-drift-check 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if ! grep -q "No schema changes" <<<"$out" || [ -n "$(git status --porcelain drizzle/)" ]; then
            git status --porcelain drizzle/
            echo "::error::src/db/schema.ts and drizzle/ disagree (or drizzle-kit needed an interactive answer). Run 'npm run db:generate -- --name <what-changed>' locally and commit drizzle/."
            exit 1
          fi
          npm run db:check

      - name: Apply migrations to the test database
        run: DATABASE_URL_MIGRATE="$TEST_DATABASE_URL" npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Audit Dependencies
        # Wraps `npm audit` so that advisories with no upstream fix can be
        # allowlisted individually (audit-allowlist.json) instead of forcing us
        # to weaken the gate for everything. See scripts/audit-gate.mjs.
        run: npm run audit:ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit & Integration Tests
        # Reporters come from vitest.config.ts (default + junit). Passing
        # --reporter on the CLI would override that and swallow console
        # output on failure. --coverage enforces the ratchet thresholds.
        run: npx vitest run --coverage

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: src/StackAlchemist.Web/test-results/
          retention-days: 7

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: src/StackAlchemist.Web/coverage/
          retention-days: 7

  backend:
    name: Backend (.NET Build & Test)
    runs-on: ubuntu-latest
    # No service containers: the test suites talk to Supabase over HTTP and
    # mock everything else — the old postgres:16 service was never used.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore Dependencies
        run: dotnet restore StackAlchemist.slnx --configfile NuGet.Config

      - name: Audit NuGet Dependencies
        # Counterpart of the frontend `npm audit` gate. Fails on any known
        # vulnerability, including transitive (e.g. NU1903 advisories).
        run: |
          set -euo pipefail
          output="$(dotnet list StackAlchemist.slnx package --vulnerable --include-transitive)"
          echo "$output"
          if echo "$output" | grep -q "GHSA-"; then
            echo "::error::Vulnerable NuGet packages detected — see output above."
            exit 1
          fi

      - name: Build Engine
        run: dotnet build src/StackAlchemist.Engine/ --no-restore --configuration Release

      - name: Build Worker
        run: dotnet build src/StackAlchemist.Worker/ --no-restore --configuration Release

      - name: Build Engine Tests
        run: dotnet build src/StackAlchemist.Engine.Tests/ --no-restore --configuration Release

      - name: Build Worker Tests
        run: dotnet build src/StackAlchemist.Worker.Tests/ --no-restore --configuration Release

      - name: Run Engine Tests
        run: dotnet test src/StackAlchemist.Engine.Tests/ --no-build --configuration Release --logger "trx;LogFileName=engine-test-results.trx" --collect:"XPlat Code Coverage"
        env:
          VSTEST_CONNECTION_TIMEOUT: "180"

      - name: Run Worker Tests
        run: dotnet test src/StackAlchemist.Worker.Tests/ --no-build --configuration Release --logger "trx;LogFileName=worker-test-results.trx" --collect:"XPlat Code Coverage"
        env:
          VSTEST_CONNECTION_TIMEOUT: "180"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: "**/TestResults/"
          retention-days: 7

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, engine, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: stackalchemist/${{ matrix.target }}:ci

  e2e-smoke:
    name: E2E Smoke (Playwright, Demo Mode)
    runs-on: ubuntu-latest
    needs: [frontend]
    # Demo mode only — no real secrets needed, runs on every trigger
    # so Quality Gate's smoke check is always meaningful.
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/StackAlchemist.Web/package-lock.json

      - name: Install Dependencies
        working-directory: src/StackAlchemist.Web
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: src/StackAlchemist.Web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Tests
        working-directory: src/StackAlchemist.Web
        run: npm run e2e:smoke
        env:
          CI: true

      - name: Upload Smoke Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-report
          path: src/StackAlchemist.Web/playwright-report/
          retention-days: 7

      - name: Upload Smoke Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-artifacts
          path: |
            src/StackAlchemist.Web/test-results/
            src/StackAlchemist.Web/e2e-results/
          retention-days: 7

  e2e-integration:
    name: E2E Integration (Playwright, Main/Nightly)
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    needs: [frontend, backend, docker]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    outputs:
      skip_e2e: ${{ steps.validate-secrets.outputs.skip_e2e }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-test — refuse to run if a SERVICE_ROLE variable is echoed in any workflow
        run: |
          set -euo pipefail
          # Refuse to load secrets if any workflow expands a *_SERVICE_ROLE_* variable
          # into an echo. Annotation messages (no $ before the name) are allowed.
          if grep -rEn 'echo[^|&]*\$[^|&]*SERVICE_ROLE' .github/workflows/ ; then
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/StackAlchemist.Web/package-lock.json

      - name: Install Dependencies
        working-directory: src/StackAlchemist.Web
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: src/StackAlchemist.Web
        run: npx playwright install --with-deps chromium

      # Postgres + Keycloak mode (phase D): no Supabase secret is needed for the
      # integration suite; the remaining secrets gate only the nightly real-API specs.
      - name: Setup .env (test)
        uses: ./.github/actions/setup-env
        with:
          environment: test
          app_url: http://localhost:3000
          aspnetcore_environment: Staging
          api_port: "5000"
          engine_api_url: http://localhost:5000
          is_test_site: "false"
          database_url: postgres://postgres:postgres@postgres:5432/stackalchemist?sslmode=disable
          cf_account_id: ${{ secrets.CF_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          r2_bucket_name: stackalchemist-generations-test
          r2_public_url: ${{ secrets.R2_PUBLIC_URL || 'https://pub-test.stackalchemist.app' }}
          cloudflare_tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN || secrets.CF_TUNNEL_TOKEN }}
          stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          anthropic_model: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          engine_service_key: ${{ secrets.ENGINE_SERVICE_KEY }}
          byok_encryption_key: ${{ secrets.BYOK_ENCRYPTION_KEY }}

      - name: Re-mask sensitive .env values
        run: |
          set -euo pipefail
          # GitHub auto-masks `${{ secrets.X }}` literals, but values round-tripped
          # through .env can leak via derived/substring forms. Re-register them.
          for key in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET ANTHROPIC_API_KEY R2_SECRET_ACCESS_KEY ENGINE_SERVICE_KEY BYOK_ENCRYPTION_KEY CLOUDFLARE_TUNNEL_TOKEN; do
            value="$(grep -E "^${key}=" .env | head -n1 | cut -d'=' -f2-)"
            if [ -n "$value" ]; then
              echo "::add-mask::${value}"
            fi
          done

      - name: Validate Required Integration Secrets
        id: validate-secrets
        run: |
          set -euo pipefail

          missing=0
          skip_e2e=false

          get_env() {
            local key="$1"
            grep -E "^${key}=" .env | head -n1 | cut -d'=' -f2-
          }

          assert_present() {
            local key="$1"
            local value
            value="$(get_env "$key")"
            if [ -z "$value" ]; then
              echo "::warning::Missing required secret/env value for ${key} — the NIGHTLY real-API specs will be skipped (the integration suite runs regardless)."
              skip_e2e=true
              return 0
            fi
          }

          assert_pattern() {
            local key="$1"
            local pattern="$2"
            local message="$3"
            local value
            value="$(get_env "$key")"
            if [ -z "$value" ]; then
              return 0
            fi
            if ! printf '%s' "$value" | grep -Eq "$pattern"; then
              echo "::error::${key} failed validation: ${message}"
              missing=1
            fi
          }

          assert_not_placeholder() {
            local key="$1"
            local value
            value="$(get_env "$key")"
            if [ -z "$value" ]; then
              return 0
            fi
            if printf '%s' "$value" | grep -Eqi '(^your[-_]|placeholder|changeme|replace[-_]?me|dummy|example)'; then
              echo "::warning::${key} appears to be a placeholder value — the NIGHTLY real-API specs will be skipped (the integration suite runs regardless)."
              skip_e2e=true
            fi
          }

          required_keys=(
            STRIPE_WEBHOOK_SECRET
            STRIPE_SECRET_KEY
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            CLOUDFLARE_TUNNEL_TOKEN
            ANTHROPIC_API_KEY
            R2_ACCOUNT_ID
            ENGINE_SERVICE_KEY
          )

          for key in "${required_keys[@]}"; do
            assert_present "$key" || true
            assert_not_placeholder "$key"
          done

          if [ "$skip_e2e" = "true" ]; then
            echo "⚠️  One or more secrets are placeholder values. Skipping E2E Integration tests."
            echo "skip_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          assert_pattern STRIPE_WEBHOOK_SECRET '^whsec_' 'expected a Stripe webhook signing secret.'
          assert_pattern STRIPE_SECRET_KEY '^sk_' 'expected a Stripe secret key.'
          assert_pattern NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY '^pk_' 'expected a Stripe publishable key.'
          assert_pattern ANTHROPIC_API_KEY '^sk-ant-' 'expected an Anthropic API key.'
          assert_pattern R2_ACCOUNT_ID '^[0-9a-fA-F]{32}$' 'expected a 32-character Cloudflare account id.'
          assert_pattern ENGINE_SERVICE_KEY '^.{32,}$' 'expected a non-trivial engine service key.'
          assert_pattern R2_ACCESS_KEY_ID '^.{16,}$' 'expected a non-trivial R2 access key id.'
          assert_pattern R2_SECRET_ACCESS_KEY '^.{32,}$' 'expected a non-trivial R2 secret access key.'
          assert_pattern CLOUDFLARE_TUNNEL_TOKEN '^.{32,}$' 'expected a non-trivial Cloudflare tunnel token.'

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "skip_e2e=false" >> "$GITHUB_OUTPUT"

      - name: Start Postgres + Keycloak (test compose stack)
        # Phase D: the CI database and the identity provider are containers this job
        # starts itself. The realm is imported from docker/keycloak/*.json on boot.
        # 180 s: Keycloak's import takes ~30 s; a stuck container must fail here, not at the job timeout.
        run: docker compose -f docker/docker-compose.test.yml up -d --wait --wait-timeout 180 postgres keycloak

      - name: Mint AUTH_SECRET for this run
        # No repository secret needed: Auth.js only has to agree with itself for the
        # lifetime of this job.
        run: |
          set -euo pipefail
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::${secret}"
          echo "AUTH_SECRET=${secret}" >> "$GITHUB_ENV"

      - name: Apply qavren-db migrations to the CI Postgres
        # The web app's own migrator (never drizzle-kit migrate/push), against the
        # host-published port. The Engine reaches the same database as postgres:5432.
        working-directory: src/StackAlchemist.Web
        env:
          DATABASE_URL_MIGRATE: postgres://postgres:postgres@localhost:5432/stackalchemist?sslmode=disable
        run: npm run db:migrate

      - name: Copy .env to Next.js project
        run: cp .env src/StackAlchemist.Web/.env

      - name: Build and Start Engine (Postgres mode)
        run: docker compose -f docker/docker-compose.test.yml up -d --build sa-engine

      - name: Wait for Backend Health
        run: |
          echo "Waiting for Engine API at http://localhost:5000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/healthz > /dev/null 2>&1; then
              echo "✅ Engine healthy after ~${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Engine health check timed out after 60s."
          docker compose -f docker/docker-compose.test.yml logs sa-engine --tail 30
          exit 1

      - name: Run Playwright Integration Tests
        working-directory: src/StackAlchemist.Web
        run: npm run e2e:integration
        env:
          CI: true
          # Host view of the phase D stack. Process env beats the copied .env for `next dev`.
          QAVREN_AUTH_URL: http://localhost:8080
          QAVREN_REALM: stackalchemist-ci
          AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stackalchemist?sslmode=disable
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          ENGINE_API_URL: http://127.0.0.1:5000
          E2E_KEYCLOAK_URL: http://localhost:8080

      - name: Run Playwright Nightly Tests (real APIs, non-blocking)
        # Nightly tests exercise the full external stack (Anthropic, Stripe,
        # R2, Engine). They are slow, cost real API calls, and are flake-prone
        # by design. Run only on schedule + manual dispatch, never block the
        # gate. See e2e/nightly/README or repo issues for known failures.
        if: |
          steps.validate-secrets.outputs.skip_e2e != 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        working-directory: src/StackAlchemist.Web
        continue-on-error: true
        run: npm run e2e:nightly
        env:
          CI: true
          # Host view of the phase D stack. Process env beats the copied .env for `next dev`.
          QAVREN_AUTH_URL: http://localhost:8080
          QAVREN_REALM: stackalchemist-ci
          AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stackalchemist?sslmode=disable
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          ENGINE_API_URL: http://127.0.0.1:5000
          E2E_KEYCLOAK_URL: http://localhost:8080

      - name: Dump backend container logs (always, on failure)
        if: always()
        run: |
          # Without these, an Engine error during Playwright surfaces only as
          # a generic "Schema extraction failed" in the page snapshot — the
          # actual stack trace is locked inside the container.
          echo "::group::sa-engine logs"
          docker compose -f docker/docker-compose.test.yml logs sa-engine --tail 200 || true
          echo "::endgroup::"
          echo "::group::keycloak logs"
          docker compose -f docker/docker-compose.test.yml logs keycloak --tail 100 || true
          echo "::endgroup::"
          echo "::group::postgres logs"
          docker compose -f docker/docker-compose.test.yml logs postgres --tail 100 || true
          echo "::endgroup::"

      - name: Upload Integration Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-integration-report
          path: src/StackAlchemist.Web/playwright-report/
          retention-days: 7

      - name: Upload Integration Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-integration-artifacts
          path: |
            src/StackAlchemist.Web/test-results/
            src/StackAlchemist.Web/e2e-results/
          retention-days: 7

      - name: Teardown Backend Services
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v
        continue-on-error: true

  db-pooler-nightly:
    name: qavren-db pooler smoke (nightly)
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    needs: [frontend]
    # Prod-shaped connectivity once a day: the web's migrator through the session
    # port and the Drizzle isolation suite through the Supavisor transaction pooler
    # (prepare: false). Uses the Test environment's qavren-db-test URLs (phase A).
    # Never gates a PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/StackAlchemist.Web/package-lock.json

      - name: Install Dependencies
        working-directory: src/StackAlchemist.Web
        run: npm ci

      - name: Migrate qavren-db-test (session URL)
        working-directory: src/StackAlchemist.Web
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_MIGRATE:-}" ]; then
            echo "::warning::DATABASE_URL_MIGRATE is not set in the Test environment; skipping the pooler smoke."
            exit 0
          fi
          echo "::add-mask::${DATABASE_URL_MIGRATE}"
          npm run db:migrate

      - name: Isolation suite through the transaction pooler
        working-directory: src/StackAlchemist.Web
        env:
          TEST_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "::warning::DATABASE_URL is not set in the Test environment; skipping the pooler smoke."
            exit 0
          fi
          echo "::add-mask::${TEST_DATABASE_URL}"
          npx vitest run __tests__/data/drizzle-store.integration.test.ts

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker, e2e-smoke, e2e-integration]
    if: always() && github.event_name != 'schedule'

    steps:
      - name: Check Results
        run: |
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Docker: ${{ needs.docker.result }}"
          echo "E2E Smoke: ${{ needs.e2e-smoke.result }}"
          echo "E2E Integration: ${{ needs.e2e-integration.result }} (skip_e2e=${{ needs.e2e-integration.outputs.skip_e2e }})"

          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ Frontend checks failed"
            exit 1
          fi

          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "❌ Backend checks failed"
            exit 1
          fi

          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "❌ Docker build checks failed"
            exit 1
          fi

          if [ "${{ needs.e2e-smoke.result }}" != "success" ]; then
            echo "❌ E2E smoke checks failed"
            exit 1
          fi

          echo "✅ All required quality gates passed"

      - name: Fail if E2E Integration silently skipped on main
        # Catches secret regressions: if someone removes/breaks Test env
        # secrets, e2e-integration's validate step will set skip_e2e=true
        # and exit 0. Since phase D the integration suite itself runs
        # unconditionally (Postgres + Keycloak containers, no secrets); what
        # skip_e2e now guards is the NIGHTLY real-API specs, which would
        # otherwise quietly stop protecting main.
        if: github.ref == 'refs/heads/main' && needs.e2e-integration.outputs.skip_e2e == 'true'
        run: |
          echo "::error::NIGHTLY real-API specs skipped on main — a Test environment secret is missing or a placeholder (see the validate-secrets step in .github/workflows/ci.yml). The integration suite itself still ran."
          exit 1
