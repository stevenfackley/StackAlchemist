version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      dotnet-runtime:
        patterns: ["Microsoft.Extensions.*", "Microsoft.AspNetCore.*"]
      testing:
        patterns: ["xunit*", "coverlet.*", "Microsoft.NET.Test.*", "NetArchTest.*"]
    ignore:
      # Microsoft.OpenApi 3.x is incompatible with the AspNetCore.OpenApi 10.0.9
      # XML-comment source generator (IOpenApiMediaType.Example is read-only in
      # 3.x -> CS0200 in generated code; see Dependabot #206 and docs/DECISIONS.md
      # 2026-07-06). Minors within 2.x still flow. Re-evaluate when
      # Microsoft.AspNetCore.OpenApi supports OpenApi 3.x.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react*", "eslint-config-next"]
        update-types: [minor, patch]
      testing:
        patterns: ["vitest*", "@testing-library/*", "@playwright/*", "jsdom"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/StackAlchemist.Web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react*", "eslint-config-next"]
        update-types: [minor, patch]
      testing:
        patterns: ["vitest*", "@testing-library/*", "@playwright/*", "jsdom"]
        update-types: [minor, patch]
    ignore:
      # eslint pinned to ^9 because eslint-plugin-react (transitive via eslint-config-next)
      # uses context.getFilename() which was removed in ESLint 10.
      # Re-evaluate when eslint-config-next ships an eslint-plugin-react that uses context.filename.
      # See PRs #65 (original pin) and the follow-up that re-pinned after Dependabot bypassed via #72.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7.0 is the native "Corsa" rewrite — a breaking major that
      # fails typecheck (Dependabot #222, closed 2026-07-13). Allow 6.x, block 7+.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }

  # ── Added by the project-wide Dependabot sweep ──────────────────────────
  # Ecosystems present in the repo that no existing entry covered.
  - package-ecosystem: "npm"
    directories:
      - "/src/StackAlchemist.Templates/Tier3-Infrastructure/infra/cdk"
      - "/src/StackAlchemist.Templates/V0-Spark-NextJs"
      - "/src/StackAlchemist.Templates/V1-DotNet-NextJs/nextjs"
      - "/src/StackAlchemist.Templates/V1-Python-React/frontend"
      - "/src/StackAlchemist.Templates/V2-DotNet-NextJs/nextjs"
      - "/src/StackAlchemist.Templates/V2-Python-React/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    groups:
      javascript-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The #291 wave landed (Next 16, @types/node 26, Tailwind 4, tailwind-merge 3,
      # lucide-react 1, vite 8, @vitejs/plugin-react 6, ESLint 10 in the Python-React
      # frontends, TypeScript 7 in V0-Spark and the Tier3 CDK app). Every template set now
      # has a compile gate, so majors arrive as ordinary PRs. Two stay blocked, tracked in #456:
      #
      # typescript: typescript-eslint 8 peers on typescript <6.1 and has no TS 7 support
      # yet (TS 7.0 ships no programmatic API), so every template that lints with it stays on
      # ^6.0.3: both Next templates (via eslint-config-next) and both Python-React frontends.
      # V0-Spark (no eslint) and the Tier3 CDK app are on TS 7, so their next major waits too.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint: eslint-config-next 16 pulls eslint-plugin-react 7.37 (calls
      # context.getFilename(), which ESLint 10 removed), eslint-plugin-import 2.32 and
      # eslint-plugin-jsx-a11y 6.10, all of which peer on eslint <=9. That holds the Next
      # templates on eslint 9. This entry also covers the Python-React frontends, which
      # are already on 10, so their next major waits with it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directories:
      - "/src/StackAlchemist.Templates/V1-Python-React/backend"
      - "/src/StackAlchemist.Templates/V2-Python-React/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/src/StackAlchemist.Templates/V1-DotNet-NextJs/infra"
      - "/src/StackAlchemist.Templates/V1-Python-React/infra"
      - "/src/StackAlchemist.Templates/V2-Python-React/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"

  # NOTE: no `helm` ecosystem here on purpose. infra/helm/values.yaml is a
  # Scriban template ({{ProjectNameKebab}}.example.com) — not valid YAML until
  # rendered — so the Dependabot helm updater crashes every week with
  # Psych::SyntaxError (run 32550414527, 2026-08-22). The chart declares no
  # dependencies; if it gains any, they are bumped by hand, not via Dependabot.
  - package-ecosystem: "terraform"
    directory: "/src/StackAlchemist.Templates/Tier3-Infrastructure/infra/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "deps(terraform)"
