version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      dotnet-runtime:
        patterns: ["Microsoft.Extensions.*", "Microsoft.AspNetCore.*"]
      testing:
        patterns: ["xunit*", "coverlet.*", "Microsoft.NET.Test.*", "NetArchTest.*"]
    ignore:
      # Microsoft.OpenApi 3.x is incompatible with the AspNetCore.OpenApi 10.0.9
      # XML-comment source generator (IOpenApiMediaType.Example is read-only in
      # 3.x -> CS0200 in generated code; see Dependabot #206 and docs/DECISIONS.md
      # 2026-07-06). Minors within 2.x still flow. Re-evaluate when
      # Microsoft.AspNetCore.OpenApi supports OpenApi 3.x.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react*", "eslint-config-next"]
      testing:
        patterns: ["vitest*", "@testing-library/*", "@playwright/*", "jsdom"]

  - package-ecosystem: npm
    directory: /src/StackAlchemist.Web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react*", "eslint-config-next"]
      testing:
        patterns: ["vitest*", "@testing-library/*", "@playwright/*", "jsdom"]
    ignore:
      # eslint pinned to ^9 because eslint-plugin-react (transitive via eslint-config-next)
      # uses context.getFilename() which was removed in ESLint 10.
      # Re-evaluate when eslint-config-next ships an eslint-plugin-react that uses context.filename.
      # See PRs #65 (original pin) and the follow-up that re-pinned after Dependabot bypassed via #72.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7.0 is the native "Corsa" rewrite — a breaking major that
      # fails typecheck (Dependabot #222, closed 2026-07-13). Allow 6.x, block 7+.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: npm
    directory: /src/StackAlchemist.Templates
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
