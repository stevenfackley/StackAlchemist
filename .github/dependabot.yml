version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      dotnet-runtime:
        patterns: ["Microsoft.Extensions.*", "Microsoft.AspNetCore.*"]
      testing:
        patterns: ["xunit*", "coverlet.*", "Microsoft.NET.Test.*", "NetArchTest.*"]
    ignore:
      # Microsoft.OpenApi 3.x is incompatible with the AspNetCore.OpenApi 10.0.9
      # XML-comment source generator (IOpenApiMediaType.Example is read-only in
      # 3.x -> CS0200 in generated code; see Dependabot #206 and docs/DECISIONS.md
      # 2026-07-06). Minors within 2.x still flow. Re-evaluate when
      # Microsoft.AspNetCore.OpenApi supports OpenApi 3.x.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react*", "eslint-config-next"]
        update-types: [minor, patch]
      testing:
        patterns: ["vitest*", "@testing-library/*", "@playwright/*", "jsdom"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/StackAlchemist.Web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react*", "eslint-config-next"]
        update-types: [minor, patch]
      testing:
        patterns: ["vitest*", "@testing-library/*", "@playwright/*", "jsdom"]
        update-types: [minor, patch]
    ignore:
      # eslint pinned to ^9 because eslint-plugin-react (transitive via eslint-config-next)
      # uses context.getFilename() which was removed in ESLint 10.
      # Re-evaluate when eslint-config-next ships an eslint-plugin-react that uses context.filename.
      # See PRs #65 (original pin) and the follow-up that re-pinned after Dependabot bypassed via #72.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7.0 is the native "Corsa" rewrite — a breaking major that
      # fails typecheck (Dependabot #222, closed 2026-07-13). Allow 6.x, block 7+.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }

  # ── Added by the project-wide Dependabot sweep ──────────────────────────
  # Ecosystems present in the repo that no existing entry covered.
  - package-ecosystem: "npm"
    directories:
      - "/src/StackAlchemist.Templates/Tier3-Infrastructure/infra/cdk"
      - "/src/StackAlchemist.Templates/V0-Spark-NextJs"
      - "/src/StackAlchemist.Templates/V1-DotNet-NextJs/nextjs"
      - "/src/StackAlchemist.Templates/V1-Python-React/frontend"
      - "/src/StackAlchemist.Templates/V2-DotNet-NextJs/nextjs"
      - "/src/StackAlchemist.Templates/V2-Python-React/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    groups:
      javascript-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Templates-content majors are a product decision — take the wave
      # together; remove when #291 is decided.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # Template framework majors deferred to the #291 wave (2026-09-22):
      # tailwind 4 needs a CSS-first config migration (templates still ship
      # tailwind.config.ts) and tailwind-merge 3 targets Tailwind 4; eslint 10
      # breaks eslint-plugin-react via eslint-config-next; lucide-react 1.x is
      # held to keep the template stacks consistent. Remove with #291.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      # Same #291 wave: @eslint/js 10 and eslint-plugin-react-hooks 7 move with
      # eslint 10; @vitejs/plugin-react 6 needs vite 8 (templates are on vite 6, so vite moves too);
      # globals 17 goes with the flat-config refresh (Dependabot #396-#399).
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directories:
      - "/src/StackAlchemist.Templates/V1-Python-React/backend"
      - "/src/StackAlchemist.Templates/V2-Python-React/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/src/StackAlchemist.Templates/V1-DotNet-NextJs/infra"
      - "/src/StackAlchemist.Templates/V1-Python-React/infra"
      - "/src/StackAlchemist.Templates/V2-Python-React/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"

  # NOTE: no `helm` ecosystem here on purpose. infra/helm/values.yaml is a
  # Scriban template ({{ProjectNameKebab}}.example.com) — not valid YAML until
  # rendered — so the Dependabot helm updater crashes every week with
  # Psych::SyntaxError (run 32550414527, 2026-08-22). Chart.yaml dependencies
  # in templates move with the templates wave (#291), not via Dependabot.
  - package-ecosystem: "terraform"
    directory: "/src/StackAlchemist.Templates/Tier3-Infrastructure/infra/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "deps(terraform)"
